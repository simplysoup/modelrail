# ModelRail Kustomize base. Portfolio project, nothing deployed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: modelrail
commonLabels:
  app.kubernetes.io/part-of: modelrail
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - mlflow.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - training-job.yaml
  - drift-cronjob.yaml
  # The Argo Rollouts controller is installed, so rollout.yaml is the
  # serving workload. deployment.yaml is the fallback only: do not apply
  # both, they select the same pods. See k8s/README.md.
  - rollout.yaml
  - analysis-template.yaml
images:
  - name: modelrail-serve
    newName: northamerica-northeast2-docker.pkg.dev/modelrail/modelrail/serve
    newTag: candidate
