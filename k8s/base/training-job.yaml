# ModelRail training Job. Portfolio project.
# Runs on Autopilot capacity: no Spot node pool exists on this cluster
# (a Spot pool cannot attach to Autopilot; see ADR-006), so there is no
# nodeSelector or toleration here. Checkpoints go to the GCS URI in
# CHECKPOINT_URI; the manifest-as-commit-point protocol in
# train/checkpoint.py means a preempted pod resumes from the last
# committed manifest, not a half-written file.
# The Job is launched by CI on merge to main, and by the drift retrain
# trigger. It never runs on the serving node pool.
apiVersion: batch/v1
kind: Job
metadata:
  name: modelrail-train
  labels:
    app: modelrail-train
spec:
  backoffLimit: 2
  # Preemption is expected, not exceptional: the Job retries, and
  # train.py resumes from the last checkpoint manifest.
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: modelrail-train
    spec:
      restartPolicy: Never
      serviceAccountName: training
      containers:
        - name: train
          image: northamerica-northeast2-docker.pkg.dev/modelrail/modelrail/train:latest
          imagePullPolicy: Always
          # No command override: the image entrypoint prepares the
          # data first, then runs these args. (command would replace
          # the entrypoint and skip data prep.)
          args:
            - python
            - -m
            - train.train
            - --params
            - /app/data/params.yaml
            - --data
            - /app/data/processed
            - --out
            - /app/models/run
            - --checkpoint-uri
            - gs://modelrail-modelrail-dvc/checkpoints/run
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.modelrail.svc.cluster.local:5000
            - name: TORCH_HOME
              value: /tmp/torch-hub
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
