# ModelRail Kubernetes service accounts (Workload Identity). Portfolio project.
# Names must match the Workload Identity bindings in infra/terraform/iam.tf:
# the GCP service accounts are bound to these exact KSA names, and the
# annotation below is what links each KSA to its GCP service account.
# Without both the binding and the annotation, pods get no GCP identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving
  namespace: modelrail
  annotations:
    iam.gke.io/gcp-service-account: modelrail-serving@modelrail.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training
  namespace: modelrail
  annotations:
    iam.gke.io/gcp-service-account: modelrail-training@modelrail.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: drift
  namespace: modelrail
  annotations:
    iam.gke.io/gcp-service-account: modelrail-drift@modelrail.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow
  namespace: modelrail
  annotations:
    iam.gke.io/gcp-service-account: modelrail-mlflow@modelrail.iam.gserviceaccount.com
