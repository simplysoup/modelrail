# Dev overlay: smaller resources, dev model version.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelrail-serve
spec:
  template:
    spec:
      containers:
        - name: serve
          env:
            - name: MODEL_VERSION
              value: dev
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
